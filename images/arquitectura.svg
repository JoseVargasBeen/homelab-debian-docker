<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="840" rx="16" fill="#0d1117"/>
  <text x="40" y="44" fill="#e6edf3" font-size="24" font-weight="700">Arquitectura del homelab</text>
  <text x="40" y="66" fill="#8b949e" font-size="14">PC reciclado con Debian + Docker, administrado desde Portainer</text>

  <!-- fila superior -->
  <rect x="60" y="90" width="300" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="210" y="118" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Internet</text>
  <text x="210" y="140" fill="#8b949e" font-size="13" text-anchor="middle">usuarios y navegadores</text>

  <rect x="450" y="90" width="300" height="64" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="600" y="118" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Cloudflare</text>
  <text x="600" y="140" fill="#8b949e" font-size="13" text-anchor="middle">DNS + Zero Trust Tunnel + HTTPS</text>

  <rect x="840" y="90" width="300" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="990" y="118" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Clientes VPN</text>
  <text x="990" y="140" fill="#8b949e" font-size="13" text-anchor="middle">móvil / portátil fuera de casa</text>

  <line x1="360" y1="122" x2="446" y2="122" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="403" y="112" fill="#8b949e" font-size="11" text-anchor="middle">HTTPS</text>

  <rect x="840" y="200" width="300" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="990" y="225" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Router doméstico</text>
  <text x="990" y="245" fill="#8b949e" font-size="13" text-anchor="middle">reenvío 51820/udp → WireGuard</text>
  <line x1="990" y1="154" x2="990" y2="196" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="181" fill="#8b949e" font-size="11">WireGuard</text>

  <line x1="600" y1="300" x2="600" y2="158" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="612" y="232" fill="#d29922" font-size="12">túnel saliente (cloudflared)</text>
  <text x="612" y="248" fill="#8b949e" font-size="11">sin abrir puertos HTTP en el router</text>
  <line x1="990" y1="256" x2="990" y2="296" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="282" fill="#8b949e" font-size="11">cable Ethernet</text>

  <!-- host -->
  <rect x="40" y="300" width="1120" height="510" rx="14" fill="#0f141b" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="64" y="330" fill="#58a6ff" font-size="17" font-weight="700">Servidor «Lupin»</text>
  <text x="220" y="330" fill="#8b949e" font-size="13">Debian 13 (trixie) · kernel 6.12 · x86_64 · 4 CPU · 8 GB RAM · Docker 26.1.5 · 14 stacks · 22 contenedores</text>

  <!-- grupo 1 -->
  <g transform="translate(60,350)">
    <rect width="350" height="215" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#e6edf3" font-size="15" font-weight="700">Gestión y monitoreo</text>
    <circle cx="24" cy="62" r="5" fill="#3fb950"/><text x="38" y="67" fill="#c9d1d9" font-size="14">Portainer CE</text><text x="330" y="67" fill="#8b949e" font-size="13" text-anchor="end">:9000</text>
    <circle cx="24" cy="92" r="5" fill="#3fb950"/><text x="38" y="97" fill="#c9d1d9" font-size="14">Netdata (métricas en vivo)</text><text x="330" y="97" fill="#8b949e" font-size="13" text-anchor="end">:19999</text>
    <circle cx="24" cy="122" r="5" fill="#3fb950"/><text x="38" y="127" fill="#c9d1d9" font-size="14">Heimdall (página de inicio)</text><text x="330" y="127" fill="#8b949e" font-size="13" text-anchor="end">:81</text>
  </g>
  <!-- grupo 2 -->
  <g transform="translate(425,350)">
    <rect width="350" height="215" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#e6edf3" font-size="15" font-weight="700">Red y acceso remoto</text>
    <circle cx="24" cy="62" r="5" fill="#3fb950"/><text x="38" y="67" fill="#c9d1d9" font-size="14">cloudflared (túnel)</text><text x="330" y="67" fill="#8b949e" font-size="13" text-anchor="end">host</text>
    <circle cx="24" cy="92" r="5" fill="#3fb950"/><text x="38" y="97" fill="#c9d1d9" font-size="14">WireGuard (wg-easy)</text><text x="330" y="97" fill="#8b949e" font-size="13" text-anchor="end">:51820/udp</text>
    <circle cx="24" cy="122" r="5" fill="#3fb950"/><text x="38" y="127" fill="#c9d1d9" font-size="14">Pi-hole (DNS sin anuncios)</text><text x="330" y="127" fill="#8b949e" font-size="13" text-anchor="end">:5300</text>
    <circle cx="24" cy="152" r="5" fill="#f85149"/><text x="38" y="157" fill="#c9d1d9" font-size="14">Tailscale (detenido)</text><text x="330" y="157" fill="#8b949e" font-size="13" text-anchor="end">host</text>
  </g>
  <!-- grupo 3 -->
  <g transform="translate(790,350)">
    <rect width="350" height="215" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#e6edf3" font-size="15" font-weight="700">Nube y archivos</text>
    <circle cx="24" cy="62" r="5" fill="#3fb950"/><text x="38" y="67" fill="#c9d1d9" font-size="14">Nextcloud + MariaDB</text><text x="330" y="67" fill="#8b949e" font-size="13" text-anchor="end">:8080</text>
    <circle cx="24" cy="92" r="5" fill="#3fb950"/><text x="38" y="97" fill="#c9d1d9" font-size="14">Samba (carpetas en red)</text><text x="330" y="97" fill="#8b949e" font-size="13" text-anchor="end">:445</text>
    <circle cx="24" cy="122" r="5" fill="#3fb950"/><text x="38" y="127" fill="#c9d1d9" font-size="14">File Browser</text><text x="330" y="127" fill="#8b949e" font-size="13" text-anchor="end">:1000</text>
    <circle cx="24" cy="152" r="5" fill="#3fb950"/><text x="38" y="157" fill="#c9d1d9" font-size="14">Vaultwarden (contraseñas)</text><text x="330" y="157" fill="#8b949e" font-size="13" text-anchor="end">:8085</text>
  </g>
  <!-- grupo 4 -->
  <g transform="translate(60,580)">
    <rect width="350" height="210" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#e6edf3" font-size="15" font-weight="700">Web</text>
    <circle cx="24" cy="62" r="5" fill="#3fb950"/><text x="38" y="67" fill="#c9d1d9" font-size="14">WordPress</text><text x="330" y="67" fill="#8b949e" font-size="13" text-anchor="end">:8000</text>
    <circle cx="24" cy="92" r="5" fill="#3fb950"/><text x="38" y="97" fill="#c9d1d9" font-size="14">MySQL 8.0</text><text x="330" y="97" fill="#8b949e" font-size="13" text-anchor="end">interno</text>
    <circle cx="24" cy="122" r="5" fill="#f85149"/><text x="38" y="127" fill="#c9d1d9" font-size="14">phpMyAdmin (detenido)</text><text x="330" y="127" fill="#8b949e" font-size="13" text-anchor="end">:8081</text>
  </g>
  <!-- grupo 5 -->
  <g transform="translate(425,580)">
    <rect width="350" height="210" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#e6edf3" font-size="15" font-weight="700">Automatización</text>
    <circle cx="24" cy="62" r="5" fill="#3fb950"/><text x="38" y="67" fill="#c9d1d9" font-size="14">n8n (flujos y webhooks)</text><text x="330" y="67" fill="#8b949e" font-size="13" text-anchor="end">:5678</text>
    <circle cx="24" cy="92" r="5" fill="#3fb950"/><text x="38" y="97" fill="#c9d1d9" font-size="14">PostgreSQL 15</text><text x="330" y="97" fill="#8b949e" font-size="13" text-anchor="end">:5432</text>
    <circle cx="24" cy="122" r="5" fill="#3fb950"/><text x="38" y="127" fill="#c9d1d9" font-size="14">pgAdmin 4</text><text x="330" y="127" fill="#8b949e" font-size="13" text-anchor="end">:5050</text>
  </g>
  <!-- grupo 6 -->
  <g transform="translate(790,580)">
    <rect width="350" height="210" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#e6edf3" font-size="15" font-weight="700">Multimedia</text>
    <circle cx="24" cy="62" r="5" fill="#3fb950"/><text x="38" y="67" fill="#c9d1d9" font-size="14">Emby (streaming)</text><text x="330" y="67" fill="#8b949e" font-size="13" text-anchor="end">:8096</text>
    <circle cx="24" cy="92" r="5" fill="#3fb950"/><text x="38" y="97" fill="#c9d1d9" font-size="14">Transmission (descargas)</text><text x="330" y="97" fill="#8b949e" font-size="13" text-anchor="end">:9091</text>
    <circle cx="24" cy="122" r="5" fill="#3fb950"/><text x="38" y="127" fill="#c9d1d9" font-size="14">Jackett (indexador)</text><text x="330" y="127" fill="#8b949e" font-size="13" text-anchor="end">:9117</text>
  </g>

  <circle cx="64" cy="826" r="5" fill="#3fb950"/><text x="76" y="830" fill="#8b949e" font-size="12">en ejecución</text>
  <circle cx="176" cy="826" r="5" fill="#f85149"/><text x="188" y="830" fill="#8b949e" font-size="12">detenido</text>
</svg>
