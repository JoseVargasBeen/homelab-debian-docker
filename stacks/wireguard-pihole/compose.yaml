# VPN WireGuard (panel wg-easy) + Pi-hole como DNS de los clientes VPN.
# Ambos viven en una red propia con IPs fijas para que wg-easy apunte al Pi-hole.
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14   # la v15 cambia la configuración; fijar la versión mayor
    container_name: wg-easy
    environment:
      - WG_HOST=${WG_HOST}                 # nombre DDNS (p. ej. DuckDNS), no la IP pública fija
      - LANG=es
      - PASSWORD_HASH=${WG_PASSWORD_HASH}  # hash bcrypt; en el .env escribir cada $ como $$
      - WG_DEFAULT_DNS=10.8.1.3            # Pi-hole
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0,::/0
      - WG_PERSISTENT_KEEPALIVE=25
      - WG_MTU=1420
    volumes:
      - ./wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"                  # único puerto abierto en el router
      - "127.0.0.1:51821:51821/tcp"        # panel web solo en local o desde la VPN
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      wg-easy:
        ipv4_address: 10.8.1.2

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}   # Pi-hole v6 ya no lee WEBPASSWORD
      - FTLCONF_dns_listeningMode=all
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "5300:53/tcp"
      - "5300:53/udp"
      - "127.0.0.1:5353:80/tcp"
    restart: unless-stopped
    networks:
      wg-easy:
        ipv4_address: 10.8.1.3

networks:
  wg-easy:
    ipam:
      config:
        - subnet: 10.8.1.0/24
