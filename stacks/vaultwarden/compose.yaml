services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=false      # se crea la cuenta propia y se cierra el registro público
      - INVITATIONS_ALLOWED=false
      - SHOW_PASSWORD_HINT=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}   # hash argon2:  docker exec -it vaultwarden /vaultwarden hash
    volumes:
      - vaultwarden-data:/data
    ports:
      - "127.0.0.1:8085:80"

volumes:
  vaultwarden-data:
